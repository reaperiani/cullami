name: Build Cullami

env:
  CULLAMI_VERSION: 1.0.1

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            generator: Visual Studio 17 2022
            configure_args: -A x64
          - name: macOS universal
            os: macos-14
            generator: Unix Makefiles
            configure_args: -DCMAKE_OSX_ARCHITECTURES=arm64\;x86_64
          - name: Linux x64
            os: ubuntu-24.04
            generator: Unix Makefiles
            configure_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev
      - name: Configure
        run: >-
          cmake -S . -B build -G "${{ matrix.generator }}"
          ${{ matrix.configure_args }}
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Ad-hoc sign macOS plugins
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/bin/Cullami.clap
          codesign --force --deep --sign - build/bin/Cullami.vst3
          codesign --verify --deep --strict build/bin/Cullami.clap
          codesign --verify --deep --strict build/bin/Cullami.vst3
      - name: Package Windows plugins
        if: runner.os == 'Windows'
        working-directory: build/bin
        run: >-
          cmake -E tar cfv "../../Cullami-${{ env.CULLAMI_VERSION }}-windows-x64.zip"
          --format=zip Cullami.clap Cullami.vst3
      - name: Package macOS plugins
        if: runner.os == 'macOS'
        working-directory: build/bin
        run: >-
          tar -czf "../../Cullami-${{ env.CULLAMI_VERSION }}-macos-universal.tar.gz"
          Cullami.clap Cullami.vst3
      - name: Package Linux plugins
        if: runner.os == 'Linux'
        working-directory: build/bin
        run: >-
          tar -czf "../../Cullami-${{ env.CULLAMI_VERSION }}-linux-x64.tar.gz"
          Cullami.clap Cullami.vst3
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: Cullami-package-${{ matrix.os }}
          path: Cullami-${{ env.CULLAMI_VERSION }}-*
          if-no-files-found: error
          compression-level: 0
